# Render Profile - OpenAI Configuration

# OpenAI Configuration for Render
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4
spring.ai.openai.chat.options.temperature=0.7
spring.ai.openai.embedding.options.model=text-embedding-3-small
spring.ai.openai.embedding.options.dimensions=1024

# Render Database Configuration (Render connectionString is not JDBC-shaped,
# so the URL is assembled from the database's host/port/name properties)
spring.datasource.url=jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT:5432}/${DATABASE_NAME}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# Flowable Render Configuration
flowable.database-schema-update=true
flowable.async-executor-activate=true

# Render-specific Configuration
server.port=${PORT:8080}

# Verbose logging for local development
logging.level.com.aiworkflow.designer=DEBUG
logging.level.org.springframework.ai=DEBUG