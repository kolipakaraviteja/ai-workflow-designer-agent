# Application Configuration
spring.application.name=ai-workflow-designer-agent
server.port=8080

# Common Database Configuration — credentials are externalized per profile.
# No defaults here: a non-local profile without an explicit datasource fails
# fast instead of silently targeting localhost inside a container.
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=always

# Flowable Configuration
flowable.database-schema-update=true
flowable.async-executor-activate=true
flowable.deploy-resources=false

# Spring AI Common Configuration
spring.ai.retry.max-attempts=3
spring.ai.retry.initial-interval=1000
spring.ai.retry.multiplier=2

# Vector Store Configuration
spring.ai.vectorstore.pgvector.index-type=IVFFlat
spring.ai.vectorstore.pgvector.dimension=1024
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.table-name=bpmn_knowledge
spring.ai.vectorstore.pgvector.initialize-schema=false

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# Logging — level tag carries the request correlation id from the MDC
logging.level.com.aiworkflow.designer=INFO
logging.level.org.springframework.ai=WARN
logging.level.org.flowable=INFO
logging.pattern.level=%5p [${spring.application.name:},%t,%X{correlationId}]

# CORS Configuration — deployed environments inject the frontend origin
# (e.g. CORS_ALLOWED_ORIGINS=https://workflow-frontend.onrender.com)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# JWT Configuration — no default: JWT_SECRET is required outside the local/test profiles
jwt.secret=${JWT_SECRET:}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}

# Admin bootstrap — APP_ADMIN_PASSWORD is required outside the local/test profiles
app.admin.username=${APP_ADMIN_USERNAME:admin}
app.admin.password=${APP_ADMIN_PASSWORD:}

# File upload limits
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
