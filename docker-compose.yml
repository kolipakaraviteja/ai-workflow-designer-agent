services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: workflow-postgres
    environment:
      POSTGRES_DB: workflow_designer
      POSTGRES_USER: workflow_user
      POSTGRES_PASSWORD: workflow_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workflow_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: workflow-backend
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/workflow_designer
      SPRING_DATASOURCE_USERNAME: workflow_user
      SPRING_DATASOURCE_PASSWORD: workflow_password
      LLM_STUDIO_API_KEY: ${LLM_STUDIO_API_KEY:-sk-local}
      # LM Studio inside containers must reach the host via host.docker.internal
      LLM_STUDIO_BASE_URL: ${LLM_STUDIO_BASE_URL:-http://host.docker.internal:1234/v1}
      LLM_STUDIO_MODEL: ${LLM_STUDIO_MODEL:-nvidia/nemotron-3-nano-omni}
      LLM_STUDIO_EMBEDDING_MODEL: ${LLM_STUDIO_EMBEDDING_MODEL:-text-embedding-qwen3-embedding-0.6b}
      # Dev credentials come from application-local.properties (SPRING_PROFILES_ACTIVE=local).
      # Do not add weak fallbacks here — production profiles require real values.
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend lives in a separate repo (ai-workflow-designer-ui).
  # For local UI development run `npm run dev` there — the Vite dev server
  # on :3000 proxies /api to this backend on :8080.

volumes:
  postgres_data:
